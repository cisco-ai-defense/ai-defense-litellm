---
# CI for the cisco-ai-defense-litellm pip package.
#
# Triggers, concurrency, junit/dorny reporter, and step-summary patterns are
# Action-pinning policy follows the simulator: upstream `actions/*` at the
# major-version tag, `cisco-actions/*` mirrors pinned to commit SHA.
name: CI - Build & Test (LiteLLM)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: ci-litellm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & build (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e ".[sdk]"
          python -m pip install pytest pytest-asyncio pytest-cov

      - name: Run tests with coverage and junit XML
        run: |
          set -o pipefail
          mkdir -p test-results
          pytest -v \
            --cov=cisco_ai_defense_litellm \
            --cov-report=term \
            --cov-report=xml:test-results/coverage.xml \
            --junitxml=test-results/pytest.xml 2>&1 | tee test-results/pytest.log

      - name: Test report
        if: always()
        uses: cisco-actions/dorny-test-reporter@bf3572e4335e01173062eb6188db381d9461445b # v2.3.0
        with:
          name: Pytest Results (Python ${{ matrix.python-version }})
          path: test-results/pytest.xml
          reporter: java-junit
          fail-on-error: true

      - name: Build sdist + wheel
        run: python -m build

      - name: Verify distributions
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload distributions
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: cisco-ai-defense-litellm-dist
          path: dist/*
          retention-days: 14
          if-no-files-found: error

      - name: Job summary
        if: always()
        env:
          PY_VER: ${{ matrix.python-version }}
        run: |
          {
            echo "## Test Results — Python ${PY_VER}"
            echo
            if [ -f test-results/pytest.log ]; then
              if grep -q -E "FAILED|ERROR" test-results/pytest.log; then
                echo "### Failed Tests"
                grep -E "FAILED|ERROR" test-results/pytest.log || true
              else
                echo "All tests passed."
              fi
            fi
            if [ -f test-results/coverage.xml ]; then
              COVERAGE=$(python -c "
          import xml.etree.ElementTree as ET
          try:
              r = ET.parse('test-results/coverage.xml').getroot()
              print(f\"{float(r.get('line-rate', 0))*100:.1f}%\")
          except Exception:
              print('N/A')
          " 2>/dev/null || echo "N/A")
              echo
              echo "**Coverage:** ${COVERAGE}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
