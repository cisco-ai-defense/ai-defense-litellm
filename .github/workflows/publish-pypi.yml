---
# Aligns with cisco-ai-defense/ai-defense-python-sdk/.github/workflows/release.yml:
# push semver tag → PyPI via OIDC (Trusted Publishing), GitHub Environment `pypi`.
#
# This repo uses tag prefix litellm-v*. Version in pyproject.toml must match the tag
# (see verify step).
#
# Prerequisites:
# - GitHub Environment `pypi` on this repository (and any required reviewers).
# - PyPI Trusted Publisher for this repo + workflow + environment `pypi` (package
#   cisco-ai-defense-litellm).
name: Publish to PyPI

on:
  push:
    tags:
      - "litellm-v*"

permissions:
  contents: read

jobs:
  pypi-publish:
    name: upload release to PyPI
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    environment:
      name: pypi
      url: https://pypi.org/p/cisco-ai-defense-litellm
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#litellm-v}"
          PKG_VERSION=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "Tag version : $TAG_VERSION"
          echo "Pkg version : $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject.toml version $PKG_VERSION"
            exit 1
          fi

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      # Reference SDK uses `poetry build`; this component is setuptools-backed (pyproject.toml).
      - name: Build the package
        run: python -m build

      - name: Verify distributions
        run: python -m twine check dist/*

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
